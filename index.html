<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Jeinnet!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle, #ffe4e6, #fce7f3);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            max-width: 500px;
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            text-align: center;
            animation: fadeIn 2s ease-in;
            border: 2px solid white;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .photo-frame {
            width: 180px; height: 180px;
            margin: 20px auto;
            border-radius: 50%;
            border: 6px solid #fb7185;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .photo-frame:hover { transform: scale(1.1); }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        h1 { font-family: 'Dancing Script', cursive; color: #e11d48; font-size: 3em; }
        .nama { font-weight: bold; color: #9f1239; font-size: 1.5em; }
        .pesan { font-style: italic; color: #4c0519; margin: 20px 0; line-height: 1.8; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday!</h1>
        <div class="photo-frame">
            <img src="photo-34aa0747-58c3-4e07-9dd5-14f2c27d522a-original.jpg" alt="Jeinnet">
        </div>
        <div class="nama">Jeinnet Verara Ayomi</div>
        <p class="pesan">
            "Selamat usia ke-19! Semoga perjalananmu di Sistem Informasi penuh dengan pencapaian gemilang. Tetaplah menjadi sosok yang inspiratif, kuat, dan penuh kebahagiaan. Dunia sedang menunggu karya hebatmu!"
        </p>
        <div style="font-size: 40px;">🎂💻🌹✨</div>
    </div>
    <audio autoplay loop>
  <source src="lagu-ultah.mp3" type="audio/mpeg">
  Browser Anda tidak mendukung elemen audio.
</audio>
</body>
</html>
